<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#140b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#dc2626" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="675" fill="#dc2626"/>
  <text x="56" y="74" fill="#dc2626" font-size="17" font-weight="700" letter-spacing="3.5">SYSTEMS PROJECT</text>
  <text x="56" y="124" fill="#f1f5f9" font-size="38" font-weight="800">Metadata Journaling File System</text>
  <line x1="56" y1="150" x2="1144" y2="150" stroke="#dc2626" stroke-opacity="0.25" stroke-width="1.5"/>

  <rect x="56" y="210" width="250" height="100" rx="14" fill="#111827" stroke="#dc2626" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="181" y="244" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">write()</text>
  <text x="181" y="268" fill="#94a3b8" font-size="13.5" text-anchor="middle">metadata change</text>
  <text x="181" y="289" fill="#94a3b8" font-size="13.5" text-anchor="middle">requested</text>
  <line x1="312" y1="260" x2="356" y2="260" stroke="#dc2626" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="362" y="210" width="280" height="100" rx="14" fill="#1c1117" stroke="#dc2626" stroke-opacity="0.85" stroke-width="2"/>
  <text x="502" y="244" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">Journal (WAL)</text>
  <text x="502" y="268" fill="#94a3b8" font-size="13.5" text-anchor="middle">intent logged</text>
  <text x="502" y="289" fill="#94a3b8" font-size="13.5" text-anchor="middle">before commit</text>
  <line x1="648" y1="260" x2="692" y2="260" stroke="#dc2626" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="698" y="210" width="250" height="100" rx="14" fill="#1c1117" stroke="#dc2626" stroke-opacity="0.85" stroke-width="2"/>
  <text x="823" y="244" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">Commit Record</text>
  <text x="823" y="268" fill="#94a3b8" font-size="13.5" text-anchor="middle">transaction</text>
  <text x="823" y="289" fill="#94a3b8" font-size="13.5" text-anchor="middle">marked complete</text>
  <path d="M 823 316 L 823 360" stroke="#dc2626" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="56" y="366" width="250" height="100" rx="14" fill="#111827" stroke="#dc2626" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="181" y="400" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">Inode Table</text>
  <text x="181" y="424" fill="#94a3b8" font-size="13.5" text-anchor="middle">allocation +</text>
  <text x="181" y="445" fill="#94a3b8" font-size="13.5" text-anchor="middle">metadata</text>
  <rect x="362" y="366" width="280" height="100" rx="14" fill="#111827" stroke="#dc2626" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="502" y="400" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">Block Layer</text>
  <text x="502" y="424" fill="#94a3b8" font-size="13.5" text-anchor="middle">ext2-inspired</text>
  <text x="502" y="445" fill="#94a3b8" font-size="13.5" text-anchor="middle">on-disk layout</text>
  <rect x="698" y="366" width="250" height="100" rx="14" fill="#1c1117" stroke="#dc2626" stroke-opacity="0.85" stroke-width="2"/>
  <text x="823" y="400" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">Checkpoint</text>
  <text x="823" y="424" fill="#94a3b8" font-size="13.5" text-anchor="middle">journal replayed</text>
  <text x="823" y="445" fill="#94a3b8" font-size="13.5" text-anchor="middle">to final blocks</text>
  <path d="M 698 416 L 648 416" stroke="#dc2626" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 362 416 L 312 416" stroke="#dc2626" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="972" y="210" width="172" height="256" rx="14" fill="#1c1117" stroke="#dc2626" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1058" y="252" fill="#f1f5f9" font-size="16" font-weight="700" text-anchor="middle">Crash?</text>
  <text x="1058" y="288" fill="#94a3b8" font-size="13" text-anchor="middle">Replay the</text>
  <text x="1058" y="308" fill="#94a3b8" font-size="13" text-anchor="middle">journal.</text>
  <text x="1058" y="344" fill="#94a3b8" font-size="13" text-anchor="middle">Metadata never</text>
  <text x="1058" y="364" fill="#94a3b8" font-size="13" text-anchor="middle">half-written.</text>
  <text x="1058" y="410" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">consistent</text>
  <text x="1058" y="430" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">by construction</text>
  <text x="56" y="510" fill="#94a3b8" font-size="15">An ext2-inspired journaling file system written from scratch in C — crash-consistent</text>
  <text x="56" y="534" fill="#94a3b8" font-size="15">metadata writes, inode management, and block-level journaling.</text>
  <rect x="56" y="562" width="24.2" height="34" rx="17" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-opacity="0.35"/>
  <text x="68.1" y="584" fill="#f87171" font-size="13.5" font-weight="600" text-anchor="middle">C</text>
  <rect x="92.2" y="562" width="155.39999999999998" height="34" rx="17" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-opacity="0.35"/>
  <text x="169.89999999999998" y="584" fill="#f87171" font-size="13.5" font-weight="600" text-anchor="middle">Operating Systems</text>
  <rect x="259.59999999999997" y="562" width="114.39999999999999" height="34" rx="17" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-opacity="0.35"/>
  <text x="316.79999999999995" y="584" fill="#f87171" font-size="13.5" font-weight="600" text-anchor="middle">File Systems</text>
  <rect x="385.99999999999994" y="562" width="171.79999999999998" height="34" rx="17" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-opacity="0.35"/>
  <text x="471.8999999999999" y="584" fill="#f87171" font-size="13.5" font-weight="600" text-anchor="middle">Systems Programming</text>
  <text x="56" y="641" fill="#64748b" font-size="15" font-style="italic">System diagram, drawn from the project description.</text>
</svg>